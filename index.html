<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INNEREYE Data Processing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#111827;
      --muted:#667085;
      --line:#e5e7eb;
      --soft:#f7f8fa;
      --accent:#111827
    }

    *{
      box-sizing:border-box
    }

    html,body{
      margin:0;
      padding:0;
      min-height:100%
    }

    body{
      margin:0;
      min-height:100vh;
      background:#fff;
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      position:relative
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),
        url("./Homepage.jpg");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      opacity:.20;
      filter:saturate(.72) brightness(1.08) contrast(.92);
      z-index:-2
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(255,255,255,.22);
      z-index:-1
    }

    .shell{
      min-height:100vh;
      padding:44px 52px;
      position:relative;
      overflow:hidden
    }

    .top-controls{
      position:fixed;
      top:28px;
      right:32px;
      display:flex;
      align-items:center;
      gap:12px;
      z-index:10
    }

    .lang-btn{
      width:48px;
      height:48px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#fff;
      cursor:pointer;
      font-size:22px;
      box-shadow:0 7px 24px rgba(17,24,39,.07);
      flex:0 0 auto
    }

    .visitor-counter{
      height:48px;
      padding:0 17px;
      border:1px solid var(--line);
      border-radius:24px;
      background:#fff;
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      box-shadow:0 7px 24px rgba(17,24,39,.07);
      color:var(--ink)
    }

    .visitor-label{
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      letter-spacing:.09em;
      text-transform:uppercase
    }

    .visitor-value{
      min-width:20px;
      text-align:right;
      font-size:14px;
      font-weight:800;
      font-variant-numeric:tabular-nums
    }

    .hero{
      max-width:920px;
      margin:15vh auto 0;
      text-align:center
    }

    h1{
      margin:16px 0 18px;
      font-size:clamp(44px,6vw,82px);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:800
    }

    .tabs{
      position:fixed;
      left:40px;
      bottom:36px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
      z-index:10;
      max-height:calc(100vh - 130px);
      overflow:auto;
      padding-right:8px
    }

    .tab{
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:54px;
      min-width:280px;
      padding:0 20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-size:15px;
      font-weight:800;
      box-shadow:0 10px 32px rgba(17,24,39,.08);
      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease
    }

    .tab:hover{
      transform:translateY(-2px);
      border-color:#c9cdd5;
      box-shadow:0 14px 38px rgba(17,24,39,.12)
    }

    .tab .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#1f7a4d;
      flex:0 0 auto
    }

    .tab.normalization .dot{
      background:#2563eb
    }

    .tab.multi .dot{
      background:#7c3aed
    }

    .tab.scan .dot{
      background:#d97706
    }

    .tab.quality .dot{
      background:#0f766e
    }

    .homepage-credit{
      position:fixed;
      right:32px;
      bottom:28px;
      z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px
    }

    .homepage-credit img{
      display:block;
      width:120px;
      height:auto;
      max-height:90px;
      object-fit:contain
    }

    .homepage-credit span{
      color:var(--muted);
      font-size:11px;
      font-weight:600;
      letter-spacing:.01em;
      white-space:nowrap
    }

    @media(max-width:720px){
      .shell{
        padding:28px 22px
      }

      .hero{
        margin-top:16vh
      }

      .tabs{
        left:20px;
        bottom:22px;
        max-width:calc(100vw - 40px)
      }

      .tab{
        min-height:50px;
        min-width:min(300px,calc(100vw - 40px));
        padding:0 17px;
        font-size:13px
      }

      .top-controls{
        top:20px;
        right:20px;
        gap:8px
      }

      .lang-btn{
        width:44px;
        height:44px;
        font-size:20px
      }

      .visitor-counter{
        height:44px;
        padding:0 13px;
        gap:6px
      }

      .visitor-label{
        font-size:9px
      }

      .visitor-value{
        font-size:12px
      }

      .homepage-credit{
        right:20px;
        bottom:22px
      }

      .homepage-credit img{
        width:90px;
        max-height:70px
      }

      .homepage-credit span{
        font-size:9px
      }
    }
  </style>
</head>

<body>
  <main class="shell">

    <div class="top-controls">
      <button
        id="langBtn"
        class="lang-btn"
        aria-label="Change language"
        title="Language"
      >🌐</button>

      <div
        class="visitor-counter"
        aria-label="Homepage visitor count"
        title="Homepage visitors"
      >
        <span class="visitor-label" data-i18n="visitors">Visitors</span>
        <span
          id="visitorCount"
          class="visitor-value"
          aria-live="polite"
        >...</span>
      </div>
    </div>

    <section class="hero">
      <h1 data-i18n="title">Homepage.</h1>
    </section>

    <nav class="tabs" aria-label="Processing modules">
      <a class="tab" href="./CID%20preprocessing.html">
        <span class="dot"></span>
        <span data-i18n="cid">CID preprocessing</span>
      </a>

      <a class="tab normalization" href="./Normalization%20assessment.html">
        <span class="dot"></span>
        <span data-i18n="normalization">Normalization assessment</span>
      </a>

      <a class="tab multi" href="./CID%20multi%20point%20analysis.html">
        <span class="dot"></span>
        <span data-i18n="multi">CID multi point analysis</span>
      </a>

      <a class="tab scan" href="./CID%20Scan%20analysis.html">
        <span class="dot"></span>
        <span data-i18n="scan">CID Scan analysis</span>
      </a>

      <a class="tab quality" href="./Quality%20Control.html">
        <span class="dot"></span>
        <span data-i18n="quality">Quality Control</span>
      </a>
    </nav>

    <div class="homepage-credit">
      <img
        src="./Homepage%20Logo.jpg"
        alt="Homepage Logo"
      >
      <span>made by GangMin Shin</span>
    </div>

  </main>

  <script>
    const T = {
      en: {
        title: "Homepage.",
        visitors: "Visitors",
        cid: "CID preprocessing",
        normalization: "Normalization assessment",
        multi: "CID multi point analysis",
        scan: "CID Scan analysis",
        quality: "Quality Control"
      },
      ko: {
        title: "홈페이지.",
        visitors: "방문자",
        cid: "CID 전처리",
        normalization: "정규분포 평가",
        multi: "CID 멀티 포인트 분석",
        scan: "CID 스캔 분석",
        quality: "품질 관리"
      }
    };

    let lang = localStorage.getItem("innereye_lang") || "en";

    function renderLanguage() {
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;

        if (T[lang] && T[lang][key]) {
          el.textContent = T[lang][key];
        }
      });
    }

    document.getElementById("langBtn").addEventListener("click", () => {
      lang = lang === "en" ? "ko" : "en";
      localStorage.setItem("innereye_lang", lang);
      renderLanguage();
    });

    renderLanguage();

    const visitorCountElement = document.getElementById("visitorCount");

    const COUNTER_BASE = "https://countapi.mileshilliard.com/api/v1";
    const COUNTER_KEY =
      "gangmin-shin-github-io-innereye-data-processing-homepage-visitors";

    function displayVisitorCount(value) {
      const number = Number(value);

      if (Number.isFinite(number)) {
        visitorCountElement.textContent =
          new Intl.NumberFormat().format(number);
      } else {
        visitorCountElement.textContent = "--";
      }
    }

    async function loadVisitorCount() {
      try {
        visitorCountElement.textContent = "...";

        const endpoint =
          `${COUNTER_BASE}/hit/${COUNTER_KEY}?_=${Date.now()}`;

        const response = await fetch(endpoint, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`Visitor counter error: ${response.status}`);
        }

        const data = await response.json();

        if (
          data &&
          typeof data.value !== "undefined"
        ) {
          displayVisitorCount(data.value);
        } else {
          throw new Error("Invalid visitor counter response");
        }

      } catch (error) {
        console.error("Visitor counter failed:", error);
        visitorCountElement.textContent = "--";
      }
    }

    window.addEventListener("pageshow", () => {
      loadVisitorCount();
    });
  </script>
</body>
</html>
