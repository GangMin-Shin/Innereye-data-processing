<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CID Scan analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--green:#1f8a57;--green-soft:#eaf8f0;--danger:#b42318;--amber:#b54708;--amber-soft:#fff7e8;--shadow:0 12px 38px rgba(17,24,39,.08)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
    body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.60),rgba(255,255,255,.60)),url("./CID%20Scan%20analysis.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;opacity:.20;filter:saturate(.72) brightness(1.08) contrast(.92);z-index:-2}
    body::after{content:"";position:fixed;inset:0;background:rgba(255,255,255,.24);z-index:-1}
    button,input,select{font:inherit}button{cursor:pointer}
    .topbar{position:sticky;top:0;z-index:30;height:82px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 330px}
    .title-wrap h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.03em}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    .lang-btn,.global-reset-btn{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(17,24,39,.06);display:inline-flex;align-items:center;justify-content:center}
    .lang-btn{font-size:21px}
    .global-reset-btn{font-size:25px;font-weight:700;line-height:1;transition:.18s ease}
    .global-reset-btn:hover,.tab-reset-btn:hover{background:#f8f9fb;transform:translateY(-1px);border-color:#bdc3cc}
    .global-reset-btn:active,.tab-reset-btn:active{transform:translateY(0)}
    .dock{position:fixed;z-index:40;left:22px;bottom:22px;width:280px;max-height:calc(100vh - 44px);overflow:auto;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .dock-head{padding:8px 8px 12px}.dock-head strong{display:block;font-size:15px}.dock-head span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.nav-btn,.analysis-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font-weight:800}.nav-btn{height:42px}
    .analysis-btn{width:100%;text-align:left;padding:13px 14px;margin-top:8px;line-height:1.35;font-size:13px;transition:.18s ease}.analysis-btn:hover{transform:translateY(-1px);border-color:#bdc3cc}.analysis-btn.active{background:#111827;color:#fff;border-color:#111827}
    .dock hr{border:0;border-top:1px solid var(--line);margin:10px 0}.dock-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;padding:4px 8px}
    .workspace{margin-left:316px;padding:30px 36px 80px;max-width:1800px}
    .setup-card,.plot-card,.analysis-card{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.90);box-shadow:0 8px 28px rgba(17,24,39,.05);backdrop-filter:blur(8px)}
    .setup-card{padding:24px;margin-bottom:22px}.section-title{font-size:18px;font-weight:800;margin:0 0 18px;letter-spacing:-.02em}
    .setup-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px;align-items:end}.field label{display:block;font-size:12px;font-weight:800;color:#344054;margin-bottom:7px}.field input[type="number"],.field input[type="text"],.field select{width:100%;height:46px;border:1px solid #d9dde4;border-radius:12px;padding:0 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#88909d;box-shadow:0 0 0 3px #f0f2f5}
    .file-line{display:flex;gap:8px;align-items:center}.file-line input[type=file]{display:none}.primary,.secondary,.dangerless{height:46px;border-radius:12px;padding:0 18px;font-size:14px;font-weight:800;border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1}.primary{background:#111827;color:#fff;border-color:#111827}.secondary,.dangerless{background:#fff;color:#111827}.secondary:hover,.dangerless:hover{background:#f8f9fb}
    .filename{flex:1;height:46px;display:flex;align-items:center;padding:0 12px;border:1px dashed #cfd4dc;border-radius:12px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.read-row{display:flex;gap:10px;align-items:center;margin-top:15px;flex-wrap:wrap}.status{font-size:12px;font-weight:700;color:var(--muted)}.status.good{color:var(--green)}.status.bad{color:var(--danger)}.status.warn{color:var(--amber)}
    .detected{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800;color:#344054;background:#fafafa}.badge.good{background:var(--green-soft);color:#16653f;border-color:#ccebd9}.badge.warn{background:var(--amber-soft);color:#9a6700;border-color:#f4dfad}
    .colors{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center}.color-opt{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:#475467}.color-opt input{width:30px;height:30px;padding:0;border:0;background:none}
    .result-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:28px 0 14px}.result-header h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em}.result-header .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}.actions{display:none;align-items:center;gap:10px;flex-wrap:wrap}.actions.visible{display:flex}.toggle{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 13px;display:flex;gap:9px;align-items:center;font-size:12px;font-weight:800}.lamp{width:11px;height:11px;border-radius:50%;background:#c7cbd1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.toggle.on .lamp{background:#24b26b;box-shadow:0 0 0 4px rgba(36,178,107,.12)}.save-btn{height:44px;border:0;border-radius:12px;background:#111827;color:#fff;padding:0 17px;font-weight:800}.save-btn:disabled{opacity:.45;cursor:not-allowed}
    .analysis-card{padding:18px;margin-bottom:16px;display:none}.analysis-card.visible{display:block}
    .analysis-card-head{display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px}
    .tab-reset-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111827;font-size:21px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(17,24,39,.05);transition:.18s ease}
    .control-grid{display:grid;grid-template-columns:minmax(150px,.7fr) minmax(180px,1fr) minmax(180px,1fr) minmax(220px,1.2fr);gap:12px;align-items:end}.line-row{display:flex;gap:8px;flex-wrap:wrap}.line-toggle{height:42px;min-width:56px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800}.line-toggle.active{background:#111827;color:#fff;border-color:#111827}.range-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.range-field{min-width:130px;flex:1}.range-field label{display:block;font-size:11px;font-weight:800;color:#475467;margin-bottom:6px}.range-field input{width:100%;height:42px;border:1px solid #d9dde4;border-radius:11px;padding:0 10px}.analysis-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.analysis-actions button{height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;padding:0 14px}.analysis-actions button.primary-mini{background:#111827;color:#fff;border-color:#111827}.hint{font-size:11px;line-height:1.55;color:var(--muted);font-weight:600;margin-top:10px}
    .plots{display:grid;gap:18px}.plot-card{padding:16px;min-height:470px}.plot-title{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 10px;font-size:13px;font-weight:800}.plot{width:100%;height:540px}.empty{min-height:500px;border:1px dashed #d5dae1;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:700;line-height:1.6;padding:30px}.progress{display:none;margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}.progress.visible{display:block}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:14px;background:#fff}.result-table{width:100%;border-collapse:collapse;min-width:980px;font-size:12px}.result-table th,.result-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.result-table th:first-child,.result-table td:first-child,.result-table th:nth-child(2),.result-table td:nth-child(2){text-align:left}.result-table th{background:#f8f9fb;font-weight:800;color:#344054;position:sticky;top:0}.result-table tr:last-child td{border-bottom:0}
    @media(max-width:1200px){.setup-grid{grid-template-columns:1fr 1fr}.control-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:1050px){.dock{position:static;width:auto;max-height:none;margin:18px}.topbar{padding-left:24px}.workspace{margin-left:0;padding:12px 18px 60px}.analysis-btn{font-size:12px}}
    @media(max-width:650px){.setup-grid,.control-grid{grid-template-columns:1fr}.topbar{height:auto;padding:16px 18px}.title-wrap h1{font-size:19px}.workspace{padding:10px 12px 50px}.plot{height:420px}.result-header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <aside class="dock">
    <div class="dock-head"><strong data-i18n="module">CID Scan analysis</strong><span data-i18n="dockHint">Select an analysis function.</span></div>
    <div class="nav-row"><button class="nav-btn" onclick="history.back()" data-i18n="back">← Back</button><button class="nav-btn" onclick="location.href='./'" data-i18n="home">Home</button></div>
    <hr><div class="dock-label" data-i18n="analysis">Analysis</div>
    <button class="analysis-btn" data-mode="raw" data-i18n="rawBtn">Raw data plot</button>
    <button class="analysis-btn" data-mode="sg" data-i18n="sgBtn">SG smoothing plot</button>
    <button class="analysis-btn" data-mode="interval" data-i18n="intervalBtn">Interval analysis</button>
  </aside>

  <header class="topbar">
    <div class="title-wrap"><h1 data-i18n="module">CID Scan analysis</h1></div>
    <div class="topbar-actions">
      <button id="globalResetBtn" class="global-reset-btn" type="button" title="Reset all" aria-label="Reset all">↻</button>
      <button id="langBtn" class="lang-btn" type="button" title="Language" aria-label="Change language">🌐</button>
    </div>
  </header>

  <main class="workspace">
    <section class="setup-card">
      <h2 class="section-title" data-i18n="inputSetup">Input & output setup</h2>
      <div class="setup-grid">
        <div class="field"><label data-i18n="excelFile">Excel workbook</label><div class="file-line"><button id="excelBrowseBtn" type="button" class="secondary" data-i18n="browse">Browse</button><input id="excelInput" type="file" accept=".xlsx,.xlsm,.xls"><div id="filename" class="filename" data-i18n="noFile">No file selected</div></div></div>
        <div class="field"><label data-i18n="savePath">Save path</label><div class="file-line"><button id="folderBtn" class="secondary" data-i18n="browse">Browse</button><div id="folderName" class="filename" data-i18n="notSelected">No folder selected</div></div></div>
        <div class="field"><label data-i18n="excitation">Excitation frequency (kHz)</label><input id="excitation" type="number" min="0" step="0.1" value="100"></div>
        <div class="field"><label data-i18n="signalType">Signal type</label><select id="signalType"><option value="Phase">Phase</option><option value="EMF">EMF</option></select></div>
        <div class="field"><label data-i18n="scanSpeed">Scan speed (mm/s)</label><input id="scanSpeed" type="number" min="0.000001" step="0.01" value="1"></div>
        <div class="field"><label data-i18n="scanLength">Scan length (mm)</label><input id="scanLength" type="number" min="0.000001" step="0.01" value="6"></div>
        <div class="field"><label data-i18n="notchPosition">Estimated notch position from start (mm)</label><input id="notchPosition" type="number" min="0" step="0.01" value="2"></div>
        <div class="field"><label data-i18n="expectedSamples">Measured samples</label><input id="expectedSamples" type="number" min="1" step="1" value="6"></div>
      </div>
      <div class="read-row"><button id="readBtn" class="primary" data-i18n="readAnalyze">Read & analyze</button><span id="status" class="status" data-i18n="ready">Ready</span></div>
      <div id="detected" class="detected"></div>
      <div class="colors"><span style="font-size:11px;font-weight:800;color:#344054" data-i18n="plotColors">Plot colors</span><label class="color-opt"><input id="colorL1" type="color" value="#111827"><span>L1</span></label><label class="color-opt"><input id="colorL2" type="color" value="#2563eb"><span>L2</span></label><label class="color-opt"><input id="colorL3" type="color" value="#d97706"><span>L3</span></label></div>
    </section>

    <section>
      <div class="result-header">
        <div><h2 id="resultTitle" data-i18n="result">Processing result</h2><div id="resultSub" class="sub" data-i18n="chooseAnalysis">Read an Excel file, then choose an analysis.</div></div>
        <div id="actions" class="actions"><button id="exportAllToggle" class="toggle"><span class="lamp"></span><span data-i18n="exportAll">Export all sample plots</span></button><button id="saveBtn" class="save-btn" data-i18n="save">Save</button></div>
      </div>

      <div id="analysisControls" class="analysis-card">
        <div class="analysis-card-head">
          <button id="tabResetBtn" class="tab-reset-btn" type="button" title="Reset current analysis" aria-label="Reset current analysis">↻</button>
        </div>
        <div class="control-grid">
          <div class="field"><label data-i18n="sample">Sample</label><select id="sampleSelect"></select></div>
          <div class="field"><label data-i18n="lines">Displayed lines</label><div class="line-row"><button class="line-toggle active" data-line="L1">L1</button><button class="line-toggle active" data-line="L2">L2</button><button class="line-toggle active" data-line="L3">L3</button></div></div>
          <div id="rangeControls" class="range-row" style="display:none"><div class="range-field"><label data-i18n="rangeStart">Range start (mm)</label><input id="rangeStart" type="number" step="0.001"></div><div class="range-field"><label data-i18n="rangeEnd">Range end (mm)</label><input id="rangeEnd" type="number" step="0.001"></div></div>
          <div id="intervalActions" class="analysis-actions" style="display:none"><button id="useVisibleBtn" data-i18n="useVisible">Use visible x-range</button><button id="extremaBtn" class="primary-mini" data-i18n="findExtrema">Find local extrema</button><button id="aucBtn" class="primary-mini" data-i18n="calcAuc">Calculate corrected AUC</button></div>
        </div>
        <div id="controlHint" class="hint"></div>
        <div id="resultTableWrap"></div>
      </div>

      <div id="plots" class="plots"><div class="empty" data-i18n="empty">No plot yet.<br>Load a valid workbook and select a function from the lower-left panel.</div></div>
      <div id="progress" class="progress"></div>
    </section>
  </main>

<script>
const I18N={

const el=id=>document.getElementById(id);const tr=k=>I18N[lang][k]||k;

function setStatus(text,kind=''){el('status').textContent=text;el('status').className='status '+kind;}
function naturalNum(s){const m=String(s).match(/(\d+)/);return m?Number(m[1]):Number.MAX_SAFE_INTEGER;}

  el('tabResetBtn').title=tr('tabResetTitle');

  if(state.currentMode)activateMode(state.currentMode,false);
}

async function resetCurrentAnalysis(){

function getParams(){
  const p={excitation:Number(el('excitation').value),signalType:el('signalType').value,scanSpeed:Number(el('scanSpeed').value),scanLength:Number(el('scanLength').value),notchPosition:Number(el('notchPosition').value),expectedSamples:Number(el('expectedSamples').value)};
  if(!(p.excitation>0&&p.scanSpeed>0&&p.scanLength>0&&Number.isInteger(p.expectedSamples)&&p.expectedSamples>0&&Number.isFinite(p.notchPosition)))throw new Error(tr('invalidParams'));
  return p;
}

function parseFilenameMeta(name){
  const freq=String(name).match(/(\d+(?:\.\d+)?)\s*kHz/i);const sig=String(name).match(/\b(Phase|EMF)\b/i);
  return{frequency:freq?Number(freq[1]):NaN,signal:sig?(sig[1].toLowerCase()==='phase'?'Phase':'EMF'):null};
}

function cleanLineValues(aoa,col){
  const out=[];
  for(let r=1;r<aoa.length;r++){
    const raw=aoa[r]?.[col];
    if(raw===null||raw===undefined||String(raw).trim()==='')continue;
    const v=Number(raw);
    if(Number.isFinite(v)&&v!==0)out.push(v);
  }
  return out;
}

function invertMatrix(A){
  const n=A.length;const M=A.map((row,i)=>row.slice().concat(Array.from({length:n},(_,j)=>i===j?1:0)));
  for(let c=0;c<n;c++){
    let pivot=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[pivot][c]))pivot=r;
    if(Math.abs(M[pivot][c])<1e-14)throw new Error('Singular matrix in SG filter.');
    [M[c],M[pivot]]=[M[pivot],M[c]];const div=M[c][c];for(let j=0;j<2*n;j++)M[c][j]/=div;
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c];for(let j=0;j<2*n;j++)M[r][j]-=f*M[c][j];}
  }
  return M.map(row=>row.slice(n));
}

function sgCoefficients(window,order){
  const m=(window-1)/2;const A=[];
  for(let i=-m;i<=m;i++){const row=[];for(let p=0;p<=order;p++)row.push(i**p);A.push(row);}
  const k=order+1;const ATA=Array.from({length:k},()=>Array(k).fill(0));
  for(let r=0;r<k;r++)for(let c=0;c<k;c++)for(let i=0;i<window;i++)ATA[r][c]+=A[i][r]*A[i][c];
  const inv=invertMatrix(ATA);const coeff=[];
  for(let i=0;i<window;i++){let v=0;for(let p=0;p<k;p++)v+=inv[0][p]*A[i][p];coeff.push(v);}
  return coeff;
}

function reflectIndex(i,n){while(i<0||i>=n){if(i<0)i=-i-1;if(i>=n)i=2*n-i-1;}return i;}
function savgol(y,window,order=3){const c=sgCoefficients(window,order);const m=(window-1)/2;const out=new Array(y.length);for(let i=0;i<y.length;i++){let s=0;for(let j=-m;j<=m;j++)s+=c[j+m]*y[reflectIndex(i+j,y.length)];out[i]=s;}return out;}
function validSgWindow(fs,n){let w=Math.round(fs*0.01);if(w%2===0)w+=1;w=Math.max(5,w);if(w>n){w=n%2===1?n:n-1;}if(w<5)throw new Error('The common data length is too short for a 3rd-order SG filter.');return w;}

el('readBtn').onclick=async()=>{
  if(!state.file){setStatus(tr('needFile'),'bad');return;}if(!state.saveHandle){setStatus(tr('needFolder'),'bad');return;}
  setStatus(tr('reading'));
  try{
    const p=getParams();const buf=await state.file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
    const expected=Array.from({length:p.expectedSamples},(_,i)=>`S${i+1}`);const sampleSheets=wb.SheetNames.filter(n=>/^S\d+$/i.test(n)).sort((a,b)=>naturalNum(a)-naturalNum(b));
    if(sampleSheets.length!==expected.length||expected.some((s,i)=>sampleSheets[i]!==s))throw new Error(`${tr('sheetMismatch')} [${sampleSheets.join(', ')}]`);
    const raw={};const lengths=[];
    for(const s of expected){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:null,raw:true});const headers=(aoa[0]||[]).slice(0,3).map(v=>String(v??'').trim());
      if(headers[0]!=='L1'||headers[1]!=='L2'||headers[2]!=='L3')throw new Error(`${tr('headerMismatch')} (${s}: ${headers.join(', ')})`);
      raw[s]={};['L1','L2','L3'].forEach((line,c)=>{raw[s][line]=cleanLineValues(aoa,c);lengths.push({Sample:s,Line:line,Valid_Length:raw[s][line].length});});
    }
    const minLength=Math.min(...lengths.map(x=>x.Valid_Length));if(!Number.isFinite(minLength)||minLength<5)throw new Error(tr('noValid'));
    const duration=p.scanLength/p.scanSpeed;const fs=minLength/duration;const dx=p.scanSpeed/fs;const distance=Array.from({length:minLength},(_,i)=>i*dx);const window=validSgWindow(fs,minLength);
    const cleaned={};const smoothed={};
    for(const s of expected){cleaned[s]={};smoothed[s]={};for(const line of ['L1','L2','L3']){cleaned[s][line]=raw[s][line].slice(0,minLength);smoothed[s][line]=savgol(cleaned[s][line],window,3);}}
    const meta=parseFilenameMeta(state.file.name);
    state.dataset={workbook:wb,params:p,samples:expected,lines:['L1','L2','L3'],raw:cleaned,smoothed,distance,minLength,duration,fs,dx,sgWindow:window,sgWindowSec:0.01,sgWindowMm:p.scanSpeed*0.01,lengths,filenameMeta:meta};
    state.selectedSample=expected[0];state.ranges={};state.visibleRanges={};state.results={extrema:{},auc:{}};expected.forEach(s=>{state.ranges[s]=[0,p.scanLength];});
    populateSampleSelect();renderDetected();setStatus(tr('readSuccess'),'good');activateMode('raw',true);
  }catch(err){console.error(err);state.dataset=null;setStatus(err.message||String(err),'bad');el('detected').innerHTML='';}
};

function renderDetected(){
  const d=state.dataset;if(!d)return;const m=d.filenameMeta;const p=d.params;const freqState=Number.isFinite(m.frequency)?(Math.abs(m.frequency-p.excitation)<1e-9?tr('match'):tr('mismatch')):tr('notDetected');const sigState=m.signal?(m.signal===p.signalType?tr('match'):tr('mismatch')):tr('notDetected');
  const chips=[`<span class="badge good">${tr('minLength')}: ${d.minLength}</span>`,`<span class="badge good">${tr('duration')}: ${fmt(d.duration,4)} s</span>`,`<span class="badge good">${tr('samplingRate')}: ${fmt(d.fs,3)} Hz</span>`,`<span class="badge good">${tr('distanceStep')}: ${fmt(d.dx,6)} mm</span>`,`<span class="badge good">${tr('sgWindow')}: ${d.sgWindow} samples · ${(d.sgWindowSec*1000).toFixed(1)} ms · ${(d.sgWindowMm*1000).toFixed(1)} µm</span>`,`<span class="badge ${freqState===tr('match')?'good':'warn'}">${tr('filenameMeta')} F: ${Number.isFinite(m.frequency)?m.frequency+' kHz':tr('notDetected')} · ${freqState}</span>`,`<span class="badge ${sigState===tr('match')?'good':'warn'}">${tr('filenameMeta')} Signal: ${m.signal||tr('notDetected')} · ${sigState}</span>`];
  el('detected').innerHTML=chips.join('');
}

function populateSampleSelect(){el('sampleSelect').innerHTML=state.dataset.samples.map(s=>`<option value="${s}">${s}</option>`).join('');el('sampleSelect').value=state.selectedSample;}
el('sampleSelect').addEventListener('change',()=>{state.selectedSample=el('sampleSelect').value;syncRangeInputs();renderCurrentMode();});
document.querySelectorAll('.line-toggle').forEach(btn=>btn.addEventListener('click',()=>{const line=btn.dataset.line;if(state.selectedLines.has(line)){if(state.selectedLines.size===1){setStatus(tr('lineRequired'),'warn');return;}state.selectedLines.delete(line);btn.classList.remove('active');}else{state.selectedLines.add(line);btn.classList.add('active');}renderCurrentMode();}));
['colorL1','colorL2','colorL3'].forEach(id=>el(id).addEventListener('change',()=>{if(state.currentMode)renderCurrentMode();}));

const modeInfo={raw:{title:'modeRaw',sub:'rawSub',folder:'Raw data'},sg:{title:'modeSG',sub:'sgSub',folder:'SG smoothing'},interval:{title:'modeInterval',sub:'intervalSub',folder:'Interval analysis'}};
document.querySelectorAll('.analysis-btn').forEach(btn=>btn.addEventListener('click',()=>activateMode(btn.dataset.mode,true)));

function activateMode(mode,updateButtons=true){
  if(!state.dataset){setStatus(tr('needRead'),'bad');return;}state.currentMode=mode;
  if(updateButtons)document.querySelectorAll('.analysis-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  el('actions').classList.add('visible');el('analysisControls').classList.add('visible');el('resultTitle').textContent=tr(modeInfo[mode].title);el('resultSub').textContent=tr(modeInfo[mode].sub);
  const interval=mode==='interval';el('rangeControls').style.display=interval?'flex':'none';el('intervalActions').style.display=interval?'flex':'none';el('controlHint').textContent=tr(interval?'hintInterval':(mode==='sg'?'hintSG':'hintRaw'));el('resultTableWrap').innerHTML='';syncRangeInputs();renderCurrentMode();
}

function syncRangeInputs(){if(!state.dataset||!state.selectedSample)return;const r=state.ranges[state.selectedSample]||[0,state.dataset.params.scanLength];el('rangeStart').value=fmt(r[0],4);el('rangeEnd').value=fmt(r[1],4);}
function readRangeInputs(){const d=state.dataset;let a=Number(el('rangeStart').value),b=Number(el('rangeEnd').value);a=clamp(a,0,d.params.scanLength);b=clamp(b,0,d.params.scanLength);if(!(b>a))throw new Error(tr('rangeInvalid'));state.ranges[state.selectedSample]=[a,b];return[a,b];}
['rangeStart','rangeEnd'].forEach(id=>el(id).addEventListener('change',()=>{try{readRangeInputs();renderCurrentMode();}catch(e){setStatus(e.message,'bad');}}));
el('useVisibleBtn').onclick=()=>{const vr=state.visibleRanges[state.selectedSample];if(vr){state.ranges[state.selectedSample]=vr.slice();syncRangeInputs();renderCurrentMode();}};

function baseLayout(title,mode,sample){
  const d=state.dataset;const layout={margin:{l:76,r:28,t:30,b:78},paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{family:'Inter, sans-serif',color:'#111827'},xaxis:{title:{text:tr('distanceAxis'),font:{size:13}},showgrid:false,zeroline:false,linecolor:'#9aa1ad',linewidth:1.3,range:[0,d.params.scanLength]},yaxis:{title:{text:sensorAxis(),font:{size:13}},showgrid:false,zeroline:false,linecolor:'#9aa1ad',linewidth:1.3},legend:{orientation:'h',y:-.20,x:.5,xanchor:'center'},hovermode:'x unified',dragmode:mode==='interval'?'zoom':'zoom',title:{text:`${title} · ${sample}`,font:{size:14},x:.01,xanchor:'left'},shapes:[{type:'line',x0:d.params.notchPosition,x1:d.params.notchPosition,y0:0,y1:1,yref:'paper',line:{color:'#111827',width:1.5,dash:'dash'}}],annotations:[{x:d.params.notchPosition,y:1.02,yref:'paper',text:tr('notch'),showarrow:false,font:{size:11,color:'#111827'}}]};
  if(mode==='interval'){const r=state.ranges[sample]||[0,d.params.scanLength];layout.shapes.push({type:'rect',x0:r[0],x1:r[1],y0:0,y1:1,yref:'paper',fillcolor:'rgba(37,99,235,.08)',line:{color:'rgba(37,99,235,.45)',width:1}});}
  return layout;
}

function selectedLineList(){return state.dataset.lines.filter(l=>state.selectedLines.has(l));}
function makeTraces(sample,mode){
  const d=state.dataset;const source=mode==='raw'?d.raw:d.smoothed;const traces=[];
  for(const line of selectedLineList()){traces.push({x:d.distance,y:source[sample][line],type:'scatter',mode:'lines',name:`${line} · ${mode==='raw'?tr('rawLegend'):tr('sgLegend')}`,line:{width:mode==='raw'?1.5:2.2,color:lineColor(line)},hovertemplate:'x=%{x:.4f} mm<br>y=%{y:.6f}<extra>'+line+'</extra>'});}
  if(mode==='interval'){
    for(const line of selectedLineList()){
      const ex=state.results.extrema?.[sample]?.[line];if(ex){traces.push({x:[ex.xMax],y:[ex.yMax],type:'scatter',mode:'markers',name:`${line} local max`,marker:{size:11,symbol:'triangle-up',color:lineColor(line),line:{color:'#111827',width:1}}});traces.push({x:[ex.xMin],y:[ex.yMin],type:'scatter',mode:'markers',name:`${line} local min`,marker:{size:11,symbol:'triangle-down',color:lineColor(line),line:{color:'#111827',width:1}}});}
      const au=state.results.auc?.[sample]?.[line];if(au){
        traces.push({x:[au.peak1X,au.peak2X],y:[au.peak1Y,au.peak2Y],type:'scatter',mode:'markers',name:`${line} AUC maxima`,marker:{size:10,symbol:'circle-open',color:lineColor(line),line:{color:'#111827',width:1.2}}});
        traces.push({x:[au.x0,au.x1],y:[au.y0,au.y1],type:'scatter',mode:'lines',name:`${line} AUC baseline`,line:{width:1.4,dash:'dot',color:lineColor(line)},opacity:.75});
      }
    }
  }
  return traces;
}

const plotConfig={responsive:true,displaylogo:false,modeBarButtonsToRemove:['select2d','lasso2d'],scrollZoom:false,toImageButtonOptions:{format:'png',filename:'plot',height:900,width:1600,scale:2}};
async function renderCurrentMode(){
  if(!state.dataset||!state.currentMode)return;const sample=state.selectedSample;const mode=state.currentMode;const plotMode=mode==='raw'?'raw':(mode==='sg'?'sg':'interval');const title=tr(modeInfo[mode].title);el('plots').innerHTML='<div class="plot-card"><div class="plot-title"><span>'+title+' · '+sample+'</span></div><div id="plot-main" class="plot"></div></div>';const div=el('plot-main');const traces=makeTraces(sample,plotMode);const layout=baseLayout(title,plotMode,sample);await Plotly.newPlot(div,traces,layout,plotConfig);state.currentPlot=div;
  if(mode==='interval'){
    div.on('plotly_relayout',ev=>{let a,b;if(ev['xaxis.range[0]']!==undefined&&ev['xaxis.range[1]']!==undefined){a=Number(ev['xaxis.range[0]']);b=Number(ev['xaxis.range[1]']);}else if(Array.isArray(ev['xaxis.range'])){[a,b]=ev['xaxis.range'].map(Number);}else if(ev['xaxis.autorange']){a=0;b=state.dataset.params.scanLength;}if(Number.isFinite(a)&&Number.isFinite(b)&&b>a){a=clamp(a,0,state.dataset.params.scanLength);b=clamp(b,0,state.dataset.params.scanLength);state.visibleRanges[sample]=[a,b];state.ranges[sample]=[a,b];el('rangeStart').value=fmt(a,4);el('rangeEnd').value=fmt(b,4);}});
  }
}

function rangeIndices(range){const d=state.dataset;let i0=Math.ceil(range[0]/d.dx),i1=Math.floor(range[1]/d.dx);i0=clamp(i0,0,d.minLength-1);i1=clamp(i1,0,d.minLength-1);if(i1-i0<2)throw new Error(tr('rangeInvalid'));return[i0,i1];}
function transformed(y,isMax){return isMax?y:y.map(v=>-v);}
function peakProminence(y,idx,isMax){const z=transformed(y,isMax),peak=z[idx];let leftMin=peak,rightMin=peak;for(let k=idx-1;k>=0;k--){const v=z[k];if(v>peak)break;if(v<leftMin)leftMin=v;}for(let k=idx+1;k<z.length;k++){const v=z[k];if(v>peak)break;if(v<rightMin)rightMin=v;}const contour=Math.max(leftMin,rightMin);return Math.max(0,peak-contour);}
function dominantExtrema(x,y){
  if(y.length<5)return null;const yr=Math.max(...y)-Math.min(...y);const threshold=Math.max(1e-12,yr*0.01);const maxima=[],minima=[];
  for(let i=1;i<y.length-1;i++){const d1=y[i]-y[i-1],d2=y[i+1]-y[i];if(d1>0&&d2<=0){const prom=peakProminence(y,i,true);if(prom>=threshold)maxima.push({i,prom});}if(d1<0&&d2>=0){const prom=peakProminence(y,i,false);if(prom>=threshold)minima.push({i,prom});}}
  if(!maxima.length||!minima.length)return null;maxima.sort((a,b)=>b.prom-a.prom);minima.sort((a,b)=>b.prom-a.prom);const ma=maxima[0],mi=minima[0];const xMax=x[ma.i],yMax=y[ma.i],xMin=x[mi.i],yMin=y[mi.i];const dxSigned=xMax-xMin,dySigned=yMax-yMin;return{xMax,yMax,xMin,yMin,deltaX:Math.abs(dxSigned),deltaY:Math.abs(dySigned),slope:Math.abs(dxSigned)>1e-15?dySigned/dxSigned:NaN,maxProminence:ma.prom,minProminence:mi.prom,maxCandidates:maxima.length,minCandidates:minima.length};
}

function dominantTwoMaxima(x,y){
  if(y.length<5)return null;
  const yr=Math.max(...y)-Math.min(...y);
  const threshold=Math.max(1e-12,yr*0.01);
  const maxima=[];
  for(let i=1;i<y.length-1;i++){
    const d1=y[i]-y[i-1],d2=y[i+1]-y[i];
    if(d1>0&&d2<=0){
      const prom=peakProminence(y,i,true);
      if(prom>=threshold)maxima.push({i,prom,x:x[i],y:y[i]});
    }
  }
  if(maxima.length<2)return null;
  maxima.sort((a,b)=>b.prom-a.prom);
  const selected=maxima.slice(0,2).sort((a,b)=>a.i-b.i);
  return{
    first:selected[0],
    second:selected[1],
    maxCandidates:maxima.length,
    prominenceThreshold:threshold
  };
}

function correctedAUC(x,y){
  const x0=x[0],x1=x[x.length-1],y0=y[0],y1=y[y.length-1];let signed=0,absolute=0,positive=0,negative=0;for(let i=0;i<x.length-1;i++){const b0=y0+(y1-y0)*(x[i]-x0)/(x1-x0),b1=y0+(y1-y0)*(x[i+1]-x0)/(x1-x0);const c0=y[i]-b0,c1=y[i+1]-b1,dx=x[i+1]-x[i];const area=(c0+c1)*0.5*dx;signed+=area;absolute+=(Math.abs(c0)+Math.abs(c1))*0.5*dx;if(area>=0)positive+=area;else negative+=area;}return{x0,x1,y0,y1,signedAUC:signed,absoluteAUC:absolute,positiveAUC:positive,negativeAUC:negative};
}

el('extremaBtn').onclick=()=>{
  try{const sample=state.selectedSample;const range=readRangeInputs();const [i0,i1]=rangeIndices(range);state.results.extrema[sample]=state.results.extrema[sample]||{};const rows=[];for(const line of selectedLineList()){const x=state.dataset.distance.slice(i0,i1+1),y=state.dataset.smoothed[sample][line].slice(i0,i1+1);const r=dominantExtrema(x,y);if(r){state.results.extrema[sample][line]={...r,rangeStart:range[0],rangeEnd:range[1]};rows.push({Sample:sample,Line:line,Range_Start_mm:range[0],Range_End_mm:range[1],Local_Max_X_mm:r.xMax,Local_Max_Y:r.yMax,Local_Min_X_mm:r.xMin,Local_Min_Y:r.yMin,Delta_X_mm:r.deltaX,Delta_Y:r.deltaY,Slope_Y_per_mm:r.slope,Max_Prominence:r.maxProminence,Min_Prominence:r.minProminence,Max_Candidates:r.maxCandidates,Min_Candidates:r.minCandidates});}else{rows.push({Sample:sample,Line:line,Status:tr('noExtrema')});}}
    renderResultTable('extrema',rows);setStatus(tr('extremaDone'),'good');renderCurrentMode();
  }catch(e){setStatus(e.message||String(e),'bad');}
};

el('aucBtn').onclick=()=>{
  try{
    const sample=state.selectedSample;
    const range=readRangeInputs();
    const [i0,i1]=rangeIndices(range);
    state.results.auc[sample]=state.results.auc[sample]||{};
    const rows=[];
    for(const line of selectedLineList()){
      const xSearch=state.dataset.distance.slice(i0,i1+1);
      const ySearch=state.dataset.smoothed[sample][line].slice(i0,i1+1);
      const peaks=dominantTwoMaxima(xSearch,ySearch);
      if(!peaks){
        delete state.results.auc[sample][line];
        rows.push({Sample:sample,Line:line,Search_Range_Start_mm:range[0],Search_Range_End_mm:range[1],Status:tr('noTwoMaxima')});
        continue;
      }

      const p1=peaks.first;
      const p2=peaks.second;
      const xAuc=xSearch.slice(p1.i,p2.i+1);
      const yAuc=ySearch.slice(p1.i,p2.i+1);
      const r=correctedAUC(xAuc,yAuc);

      state.results.auc[sample][line]={
        ...r,
        searchRangeStart:range[0],
        searchRangeEnd:range[1],
        peak1X:p1.x,
        peak1Y:p1.y,
        peak2X:p2.x,
        peak2Y:p2.y,
        peak1Prominence:p1.prom,
        peak2Prominence:p2.prom,
        maxCandidates:peaks.maxCandidates,
        prominenceThreshold:peaks.prominenceThreshold
      };

      rows.push({
        Sample:sample,
        Line:line,
        Search_Range_Start_mm:range[0],
        Search_Range_End_mm:range[1],
        Peak1_X_mm:p1.x,
        Peak1_Y:p1.y,
        Peak2_X_mm:p2.x,
        Peak2_Y:p2.y,
        AUC_Start_mm:r.x0,
        AUC_End_mm:r.x1,
        Baseline_Start_Y:r.y0,
        Baseline_End_Y:r.y1,
        Peak1_Prominence:p1.prom,
        Peak2_Prominence:p2.prom,
        Max_Candidates:peaks.maxCandidates,
        Prominence_Threshold:peaks.prominenceThreshold,
        Signed_AUC:r.signedAUC,
        Absolute_AUC:r.absoluteAUC,
        Positive_AUC:r.positiveAUC,
        Negative_AUC:r.negativeAUC
      });
    }
    renderResultTable('auc',rows);
    const hasSuccess=rows.some(r=>Number.isFinite(r.Signed_AUC));
    setStatus(hasSuccess?tr('aucDone'):tr('noTwoMaxima'),hasSuccess?'good':'warn');
    renderCurrentMode();
  }catch(e){setStatus(e.message||String(e),'bad');}
};

function renderResultTable(kind,rows){
  if(!rows.length){el('resultTableWrap').innerHTML='';return;}const cols=Object.keys(rows.reduce((a,r)=>Object.assign(a,r),{}));const head=cols.map(c=>`<th>${c}</th>`).join('');const body=rows.map(r=>'<tr>'+cols.map(c=>`<td>${typeof r[c]==='number'?fmt(r[c],6):(r[c]??'')}</td>`).join('')+'</tr>').join('');el('resultTableWrap').innerHTML=`<div class="table-wrap"><table class="result-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

el('exportAllToggle').onclick=()=>{state.exportAll=!state.exportAll;el('exportAllToggle').classList.toggle('on',state.exportAll);setStatus(state.exportAll?tr('exportOn'):tr('exportOff'),state.exportAll?'good':'');};

function dataURLtoBlob(dataURL){const [meta,b64]=dataURL.split(',');const mime=meta.match(/:(.*?);/)[1];const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
async function plotDivToBlob(div){const url=await Plotly.toImage(div,{format:'png',width:1600,height:900,scale:2});return dataURLtoBlob(url);}
async function imageFromSpec(traces,layout){const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-10000px;top:0;width:1400px;height:800px;background:#fff';document.body.appendChild(tmp);try{await Plotly.newPlot(tmp,traces,layout,{displayModeBar:false,staticPlot:true});return await plotDivToBlob(tmp);}finally{try{Plotly.purge(tmp);}catch(_){}tmp.remove();}}
async function ensureDirPath(root,path){let h=root;for(const part of path.split('/').filter(Boolean))h=await h.getDirectoryHandle(part,{create:true});return h;}
async function writeBlob(root,path,blob){const parts=path.split('/').filter(Boolean);const name=parts.pop();const dir=await ensureDirPath(root,parts.join('/'));const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();}

function appendAoASheet(wb,name,aoa){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name.slice(0,31));}
function appendJsonSheet(wb,name,rows){if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name.slice(0,31));}
function parameterRows(){const d=state.dataset;return[{Parameter:'Input file',Value:state.file?.name||''},{Parameter:'Excitation frequency',Value:d.params.excitation,Unit:'kHz'},{Parameter:'Signal type',Value:d.params.signalType},{Parameter:'Scan speed',Value:d.params.scanSpeed,Unit:'mm/s'},{Parameter:'Scan length',Value:d.params.scanLength,Unit:'mm'},{Parameter:'Estimated notch position',Value:d.params.notchPosition,Unit:'mm'},{Parameter:'Measured samples',Value:d.params.expectedSamples},{Parameter:'Scan duration',Value:d.duration,Unit:'s'},{Parameter:'Common valid length',Value:d.minLength,Unit:'samples'},{Parameter:'Estimated sampling rate',Value:d.fs,Unit:'Hz'},{Parameter:'Distance per sample',Value:d.dx,Unit:'mm/sample'},{Parameter:'SG polynomial order',Value:3},{Parameter:'SG window duration',Value:d.sgWindowSec,Unit:'s'},{Parameter:'SG window samples',Value:d.sgWindow},{Parameter:'SG physical window',Value:d.sgWindowMm,Unit:'mm'}];}
function datasetSheet(sample,source){const d=state.dataset;const aoa=[['Distance_mm','L1','L2','L3']];for(let i=0;i<d.minLength;i++)aoa.push([d.distance[i],source[sample].L1[i],source[sample].L2[i],source[sample].L3[i]]);return aoa;}
function allExtremaRows(){const rows=[];for(const s of state.dataset.samples)for(const line of state.dataset.lines){const r=state.results.extrema?.[s]?.[line];if(r)rows.push({Sample:s,Line:line,Range_Start_mm:r.rangeStart,Range_End_mm:r.rangeEnd,Local_Max_X_mm:r.xMax,Local_Max_Y:r.yMax,Local_Min_X_mm:r.xMin,Local_Min_Y:r.yMin,Delta_X_mm:r.deltaX,Delta_Y:r.deltaY,Slope_Y_per_mm:r.slope,Max_Prominence:r.maxProminence,Min_Prominence:r.minProminence,Max_Candidates:r.maxCandidates,Min_Candidates:r.minCandidates});}return rows;}
function allAucRows(){const rows=[];for(const s of state.dataset.samples)for(const line of state.dataset.lines){const r=state.results.auc?.[s]?.[line];if(r)rows.push({Sample:s,Line:line,Search_Range_Start_mm:r.searchRangeStart,Search_Range_End_mm:r.searchRangeEnd,Peak1_X_mm:r.peak1X,Peak1_Y:r.peak1Y,Peak2_X_mm:r.peak2X,Peak2_Y:r.peak2Y,AUC_Start_mm:r.x0,AUC_End_mm:r.x1,Baseline_Start_Y:r.y0,Baseline_End_Y:r.y1,Peak1_Prominence:r.peak1Prominence,Peak2_Prominence:r.peak2Prominence,Max_Candidates:r.maxCandidates,Prominence_Threshold:r.prominenceThreshold,Signed_AUC:r.signedAUC,Absolute_AUC:r.absoluteAUC,Positive_AUC:r.positiveAUC,Negative_AUC:r.negativeAUC});}return rows;}
function rangeRows(){return state.dataset.samples.map(s=>({Sample:s,Range_Start_mm:state.ranges[s]?.[0]??0,Range_End_mm:state.ranges[s]?.[1]??state.dataset.params.scanLength}));}
function buildWorkbook(mode){
  const d=state.dataset;const wb=XLSX.utils.book_new();appendJsonSheet(wb,'Parameters',parameterRows());appendJsonSheet(wb,'Length_Audit',d.lengths);
  if(mode==='raw'){for(const s of d.samples)appendAoASheet(wb,`${s}_Raw`,datasetSheet(s,d.raw));}
  if(mode==='sg'){for(const s of d.samples)appendAoASheet(wb,`${s}_SG`,datasetSheet(s,d.smoothed));}
  if(mode==='interval'){appendJsonSheet(wb,'Analysis_Ranges',rangeRows());appendJsonSheet(wb,'Extrema_Results',allExtremaRows());appendJsonSheet(wb,'AUC_Results',allAucRows());for(const s of d.samples)appendAoASheet(wb,`${s}_SG`,datasetSheet(s,d.smoothed));}
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function buildAllSamplePlotEntries(mode){
  const d=state.dataset;const entries=[];for(let i=0;i<d.samples.length;i++){const s=d.samples[i];el('progress').textContent=`${tr('saving')} ${s} (${i+1}/${d.samples.length})`;const plotMode=mode==='raw'?'raw':(mode==='sg'?'sg':'interval');const traces=makeTracesForSampleExport(s,plotMode);const layout=baseLayout(tr(modeInfo[mode].title),plotMode,s);entries.push({path:`Individual/${s}_${mode}.png`,blob:await imageFromSpec(traces,layout)});}return entries;
}
function makeTracesForSampleExport(sample,mode){const d=state.dataset;const source=mode==='raw'?d.raw:d.smoothed;const traces=[];for(const line of selectedLineList())traces.push({x:d.distance,y:source[sample][line],type:'scatter',mode:'lines',name:line,line:{width:mode==='raw'?1.5:2.2,color:lineColor(line)}});if(mode==='interval'){for(const line of selectedLineList()){const ex=state.results.extrema?.[sample]?.[line];if(ex){traces.push({x:[ex.xMax],y:[ex.yMax],type:'scatter',mode:'markers',name:`${line} max`,marker:{size:11,symbol:'triangle-up',color:lineColor(line)}});traces.push({x:[ex.xMin],y:[ex.yMin],type:'scatter',mode:'markers',name:`${line} min`,marker:{size:11,symbol:'triangle-down',color:lineColor(line)}});}const au=state.results.auc?.[sample]?.[line];if(au){traces.push({x:[au.peak1X,au.peak2X],y:[au.peak1Y,au.peak2Y],type:'scatter',mode:'markers',name:`${line} AUC maxima`,marker:{size:10,symbol:'circle-open',color:lineColor(line)}});traces.push({x:[au.x0,au.x1],y:[au.y0,au.y1],type:'scatter',mode:'lines',name:`${line} AUC baseline`,line:{width:1.4,dash:'dot',color:lineColor(line)}});}}}return traces;}

el('saveBtn').onclick=async()=>{
  if(!state.dataset||!state.currentMode||!state.currentPlot){setStatus(tr('needRead'),'bad');return;}if(!state.saveHandle){setStatus(tr('needFolder'),'bad');return;}
  el('saveBtn').disabled=true;el('progress').classList.add('visible');el('progress').textContent=tr('saving');
  try{
    const mode=state.currentMode;const folder=modeInfo[mode].folder;const entries=[{path:`${state.selectedSample}_${mode}_current.png`,blob:await plotDivToBlob(state.currentPlot)},{path:`CID_Scan_${mode}_Results.xlsx`,blob:buildWorkbook(mode)}];if(state.exportAll)entries.push(...await buildAllSamplePlotEntries(mode));
    for(let i=0;i<entries.length;i++){el('progress').textContent=`${tr('saving')} ${i+1}/${entries.length}`;await writeBlob(state.saveHandle,`${folder}/${entries[i].path}`,entries[i].blob);}setStatus(tr('saved'),'good');
  }catch(err){console.error(err);setStatus(`${tr('saveFailed')}: ${err.message||err}`,'bad');}finally{el('saveBtn').disabled=false;el('progress').classList.remove('visible');}
};
